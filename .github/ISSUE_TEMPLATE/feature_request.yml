name: Feature request
description: Propose a change or new capability.
type: Feature
body:
  - type: markdown
    attributes:
      value: |
        Big cross-repo or protocol changes start in the Contracts & MRC Discussions category and are written up in the MRC repository.
  - type: dropdown
    id: kind
    attributes:
      label: Kind
      options:
        - Feature
        - Proposal
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Who has it, and what can they not do today?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: What is true when this is done?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you considered and why they do not fit.
    validations:
      required: false
